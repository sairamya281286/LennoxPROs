name: Student Portal Accessibility AUTO (WEB)

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  test_web:
    name: "Student Portal Accessibility AUTO (WEB)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:student-portal:accessibility:auto"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-web
          path: |
            report-dir
          retention-days: 3

  test_iphone:
    needs: test_web
    if: always()
    name: "Student Portal Accessibility AUTO (iPhone)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:student-portal:accessibility:auto:iphone_xr"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-iphone
          path: |
            report-dir
          retention-days: 3

  test_ipad:
    needs: test_iphone
    if: always()
    name: "Student Portal Accessibility AUTO (iPad)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:student-portal:accessibility:auto:ipad"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-ipad
          path: |
            report-dir
          retention-days: 3

  test_galaxy:
    needs: test_ipad
    if: always()
    name: "Student Portal Accessibility AUTO (Galaxy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:student-portal:accessibility:auto:galaxy_s8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-galaxy
          path: |
            report-dir
          retention-days: 3
