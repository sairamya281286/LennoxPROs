name: Outcomes Accessibility Testing AUTO

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  test_auto:
    name: "Outcomes Accessibility Testing AUTO"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:outcomes:accessibility:auto"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-web
          path: |
            report-dir
          retention-days: 3

  test_auto_pixel:
    needs: test_auto
    name: "Outcomes Accessibility Testing AUTO (PIXEL)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps
      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:outcomes:accessibility:auto:pixel"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-pixel
          path: |
            report-dir
          retention-days: 3

  test_auto_iphone:
    needs: test_auto_pixel
    name: "Outcomes Accessibility Testing AUTO (iPhone)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps
      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:outcomes:accessibility:auto:iphone_xr"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-iphone
          path: |
            report-dir
          retention-days: 3

  test_auto_galaxy:
    needs: test_auto_iphone
    if: always()
    name: "Outcomes Accessibility Testing AUTO (Galaxy S5)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps
      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:outcomes:accessibility:auto:galaxy"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-galaxy
          path: |
            report-dir
          retention-days: 3
