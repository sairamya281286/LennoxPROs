name: Slideroom Review & Submit Accessibility Testing STAGING (WEB)

on:
  schedule:
    - cron: "0 23 * * 6"
  workflow_dispatch:

jobs:
  test_slideroom_review:
    name: "Slideroom Review Accessibility Testing STAGING (WEB)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:slideroom_review:accessibility:staging"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-slideroom-review
          path: |
            report-dir
          retention-days: 3

  test_slideroom_submit:
    name: "Slideroom Submit Accessibility Testing STAGING (WEB)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:slideroom_submit:accessibility:staging"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-slideroom-submit
          path: |
            report-dir
          retention-days: 3
