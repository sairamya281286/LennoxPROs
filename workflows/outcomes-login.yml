name: Outcomes Functional Testing Login Suite

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  test_auto:
    name: "Outcomes Functional Testing Login Suite (Auto)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:outcomes:functional:login:auto"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-auto
          path: |
            report-dir
          retention-days: 3

  test_qa:
    name: "Outcomes Functional Testing Login Suite (QA)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:outcomes:functional:login:qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-qa
          path: |
            report-dir
          retention-days: 3

  test_staging:
    name: "Outcomes Functional Testing Login Suite (STAGING)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:outcomes:functional:login:staging"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-staging
          path: |
            report-dir
          retention-days: 3
