name: Student Portal Functional QA (WEB)

on:
  schedule:
    - cron: "00 21 * * *"
  workflow_dispatch:

jobs:
  test_web:
    name: "Student Portal Functional QA (WEB)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:student-portal:functional:qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-web
          path: |
            report-dir
          retention-days: 3

  test_pixel:
    needs: test_web
    if: always()
    name: "Student Portal Functional QA (Pixel)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:student-portal:functional:qa:pixel"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            report-dir
          retention-days: 3

  test_iphone:
    needs: test_pixel
    if: always()
    name: "Student Portal Functional QA (IPhone XR)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:student-portal:functional:qa:iphone_xr"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-iphone
          path: |
            report-dir
          retention-days: 3
