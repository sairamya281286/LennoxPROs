name: Outcomes Functional Testing Progressive Indexing Suite QA (WEB)

on:
  schedule:
    - cron: "00 21 * * *"
  workflow_dispatch:

jobs:
  test_auto:
    name: "Outcomes Functional Testing Progressive Indexing Suite QA (WEB)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install
      - run: npx playwright install-deps

      - name: Manage Secrets
        env:
          S3_QA_CREDENTIALS: ${{ secrets.S3_QA_CREDENTIALS }}
        run: echo "S3_QA_CREDENTIALS=$S3_QA_CREDENTIALS" > .env
      - name: "Test Execution"
        run: "npm run ui:outcomes:functional:progressive-indexing:qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            report-dir
          retention-days: 3
